name: Deploy site to Cloudflare Pages

# Manual fallback deploy: builds the static site and uploads it with
# Wrangler, bypassing the Cloudflare dashboard build settings entirely.
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# The connected-Git deployment configured in the Cloudflare dashboard
# (see DEPLOY_CLOUDFLARE.md) remains the normal path; run this workflow
# from the Actions tab only if that deployment is broken.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build static website
        run: npm ci && npm run build
        working-directory: frontend
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=studio-nova
