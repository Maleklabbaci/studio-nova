name: Studio Nova desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            script: package:windows
            file: StudioNova-win-x64.exe
          - os: macos-latest
            label: macOS universal
            script: package:macos
            file: StudioNova-mac-universal.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            mcp-server/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build embedded local server (same OS as the installer)
        run: npm run build:backend
        working-directory: desktop
      - name: Smoke-test the embedded server binary
        run: npm run smoke:backend
        working-directory: desktop
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install MCP dependencies
        run: npm ci
        working-directory: mcp-server
      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop
      - name: Build desktop resources
        run: npm run build:resources
        working-directory: desktop
      - name: Verify package inputs
        shell: bash
        run: |
          BIN="desktop/backend-dist/studio-nova-backend/studio-nova-backend"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          ok=1
          if [ ! -f "$BIN" ]; then
            echo "::error::Embedded backend missing at $BIN - the installer would ship without its local server."
            find desktop -maxdepth 3 -name 'studio-nova-backend*' -print || true
            ok=0
          fi
          if [ ! -f frontend/dist-desktop/index.html ]; then
            echo "::error::Built web app missing at frontend/dist-desktop/index.html."
            ok=0
          fi
          if [ ! -f mcp-server/dist/index.js ]; then
            echo "::error::Assistant service missing at mcp-server/dist/index.js."
            ok=0
          fi
          [ "$ok" = "1" ] || exit 1
          echo "Package inputs OK"
      - name: Package installer
        run: npm run ${{ matrix.script }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: studio-nova-installer-${{ matrix.label }}
          path: desktop/release/${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    # The landing page's download buttons point at
    # releases/latest/download/<installer>: uploading the installers here is
    # what makes them work (they are too large for Cloudflare Pages' 25 MB
    # per-file limit, so they are deliberately not hosted on the site itself).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-nova-installer-*
          path: installers
          merge-multiple: true
      - name: Create or update the release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Studio Nova $GITHUB_REF_NAME" \
              --generate-notes
          fi

  assemble-site:
    name: Assemble landing page and installers
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          pattern: studio-nova-installer-*
          path: frontend/public/downloads
          merge-multiple: true
      - name: Write installer manifest
        run: npm run write-manifest
        working-directory: desktop
        env:
          REQUIRE_ALL_DESKTOP_INSTALLERS: '1'
      - name: Build static website with install files
        run: npm ci && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: studio-nova-site
          path: frontend/dist
          retention-days: 30
